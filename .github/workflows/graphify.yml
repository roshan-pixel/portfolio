name: Auto-Update Graphify Knowledge Graph

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'graphify-out/**'
      - 'graph.html'
      - 'callflow.html'
      - 'tree.html'
      - 'graphify/**'
      - 'PORTFOLIO_SYSTEM_ARCHITECTURE.md'

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install graphifyy matplotlib networkx

      - name: Run Graphify Synchronizer
        run: |
          python scripts/update_graphify.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graph.html callflow.html tree.html graphify/ graphify-out/ PORTFOLIO_SYSTEM_ARCHITECTURE.md README.md
          if git diff --staged --quiet; then
            echo "No changes to commit in Graphify knowledge graph."
          else
            git commit -m "[skip ci] docs: auto-update Graphify knowledge graph on commit [automated]"
            git push origin main
          fi
